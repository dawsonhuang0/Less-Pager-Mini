name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # setup-node keys this on package-lock.json, so a run whose
          # deps have not moved unpacks ~/.npm instead of fetching 206
          # packages from the registry
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      # tests/fixtures/guardProbe.mjs imports the BUILT guard: it has to
      # run in a process of its own, because vitest's worker pool will
      # not schedule the guard's nested worker while the thread that
      # owns it is blocked in Atomics.wait
      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  lint:
    needs: test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # setup-node keys this on package-lock.json, so a run whose
          # deps have not moved unpacks ~/.npm instead of fetching 206
          # packages from the registry
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Linter
        run: npm run lint
